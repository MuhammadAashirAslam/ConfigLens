name: Good Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde5c9404746172dc001ab61f054a39e8c2a1 # v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f525247059d64282224d8d # v4.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
        env:
          API_KEY: ${{ secrets.PROD_API_KEY }}
